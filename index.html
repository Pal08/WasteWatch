<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maharashtra Waste Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="leafletMap"></div>

  <div class="rail">
    <div class="rail-top">
      <div class="rail-btn" title="Menu" id="menuBtn" onclick="toggleMenu(event)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        <div class="menu-dropdown" id="menuDropdown">
          <div class="menu-item" onclick="handleLiveLocation(event)"><span class="ic">📍</span>Live location</div>
          <div class="menu-item" onclick="openPrecautions(event)"><span class="ic">⚠️</span>Precautions</div>
        </div>
      </div>
    </div>
    <div class="rail-bottom"></div>
  </div>

  <div class="topbar">
    <div class="searchbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
      <input id="searchInput" type="text" placeholder="Search a city, town or taluka">
    </div>
    <div class="chip sev-all active" id="chipAll" onclick="setFilter('all', this)">All</div>
    <div class="chip sev-high" id="chipHigh" onclick="setFilter('high', this)">🗑️ Low treatment</div>
    <div class="chip sev-moderate" id="chipModerate" onclick="setFilter('moderate', this)">🗑️ Partial</div>
    <div class="chip sev-low" id="chipLow" onclick="setFilter('low', this)">🗑️ Well-treated</div>
  </div>

  <div class="zoomhint" id="zoomHint">Zoomed out: showing district hubs. Zoom in to see every city, town and taluka.</div>

  <div class="legend">
    <b>Waste treatment rate 🗑️</b>
    <span><i class="dot" style="background:#d93025"></i>&lt;70% treated</span>
    <span><i class="dot" style="background:#f9ab00"></i>70–90% treated</span>
    <span><i class="dot" style="background:#188038"></i>&gt;90% treated</span>
    <span class="src-tag">Source: <a href="https://mpcb.gov.in/sites/default/files/solid-waste/msw_annual_report_2021_12082022.pdf" target="_blank" rel="noopener">MPCB SWM Annual Report 2021</a></span>
  </div>

  <div class="toast" id="toast"></div>

  <div class="zoomctl">
    <button id="zoomIn">+</button>
    <button id="zoomOut">&minus;</button>
  </div>
  <div class="locatebtn" id="locateBtn">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9-1h-2.06A7 7 0 0013 .06V-2h-2v2.06A7 7 0 004.06 7H2v2h2.06A7 7 0 0011 15.94V18h2v-2.06A7 7 0 0019.94 9H22V7z"/></svg>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="cardInner"></div>
</div>

<script src="script.js"></script>
</body>
</html>
